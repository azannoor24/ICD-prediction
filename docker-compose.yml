version: '3.8'

services:
  icd-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    image: icd-predictor:alpine
    container_name: icd-predictor
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # Mount uploads and results for persistence
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
